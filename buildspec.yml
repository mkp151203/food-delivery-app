version: 0.2

env:
  variables:
    VITE_API_URL: "https://gf3w1gt2sf.execute-api.us-east-1.amazonaws.com/prod"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend
      - npm ci
  build:
    commands:
      - echo "Building frontend with API URL $VITE_API_URL"
      - npm run build
  post_build:
    commands:
      - echo "Deploying to S3..."
      - aws s3 sync dist/ s3://food-delivery-frontend-998718206191 --delete
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id E1KUNR5WQZIZM9 --paths "/*"

artifacts:
  files:
    - frontend/dist/**/*
  discard-paths: no
